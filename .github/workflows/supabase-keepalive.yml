# Supabase free tier uspí projekt po ~7 dnech bez aktivity.
# Uspaný projekt = klient místo aplikace vidí chybu.
# Tenhle cron dvakrát denně sáhne na REST API, což se počítá jako aktivita.
# (Definitivní řešení je Pro plán — pak lze workflow smazat.)
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6,18 * * *' # 6:17 a 18:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          # 200 = OK; 5xx/timeout = projekt nejspíš spí nebo je nedostupný
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "::error::Supabase neodpovídá (HTTP $code) — projekt může být uspaný"
            exit 1
          fi
